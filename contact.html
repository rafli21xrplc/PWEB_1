<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicBoutique - Contact Us</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">ChicBoutique</a>
                <input type="checkbox" id="nav-toggle" class="nav-toggle">
                
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                </label>
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="cart.html">Cart (3)</a></li>
                        <li><a href="contact.html" class="active">Contact</a></li>
                        <li><a href="checkout.html" class="btn" style="color: white;">Checkout</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="page">
            <h2 class="page-title">Contact Us</h2>
            <div class="form-container">
                <p style="margin-bottom: 2rem; text-align: center; font-size: 1.1rem;">Have a question? Fill out the form below and we'll get back to you!</p>
                <form action="#" method="post" class="form-grid">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type
                    ="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>

    </main>

    <footer class="site-footer">
        <p>&copy; 2025 ChicBoutique. All rights reserved.</p>
        <p>A static HTML & CSS demo website.</p>
    </footer>

</body>
</html>
